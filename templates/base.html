<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>CáDoces - Gestão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --cadoces-dark: #2c2c2c;
            --cadoces-pink: #e03582;
            --cadoces-bg: #faf9f6;
        }
        body { background-color: var(--cadoces-bg); color: var(--cadoces-dark); font-family: sans-serif; }
        .navbar-brand { font-family: serif; font-weight: bold; color: var(--cadoces-dark) !important; font-size: 1.5rem; }
        .navbar-brand span { color: var(--cadoces-pink); }
        .menu-card {
            background-color: #ffffff; border: 2px solid #eae5d9; border-radius: 12px;
            padding: 24px; text-align: center; height: 160px; display: flex;
            flex-direction: column; justify-content: center; align-items: center; text-decoration: none !important;
            box-shadow: 0 4px 12px rgba(44, 44, 44, 0.05); transition: all 0.2s ease;
        }
        .menu-card:hover { border-color: var(--cadoces-pink); background-color: #fff8fb; transform: translateY(-3px); }
        .menu-icon { font-size: 2.2rem; margin-bottom: 8px; }
        .menu-title { font-size: 1.1rem; font-weight: 600; color: var(--cadoces-dark) !important; }
        .menu-desc { font-size: 0.8rem; color: #777777 !important; }
        .btn-cadoces { background-color: var(--cadoces-dark); color: #ffffff; border: none; font-weight: 600; }
        .btn-cadoces:hover { background-color: var(--cadoces-pink); color: #ffffff; }
        .badge-pink { background-color: var(--cadoces-pink); color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Cá<span>Doces</span> <small class="text-muted fs-6" style="font-family: sans-serif;">made with love</small></a>
        </div>
    </nav>
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
